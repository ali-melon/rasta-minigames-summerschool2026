<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شبیه‌ساز مفهومی Manchester Coding</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0c10; --panel-bg: #1f2833; --primary: #66fcf1; --primary-dark: #45a29e;
            --success: #00ff88; --danger: #ff4757; --scope-bg: #030a0f; --text-light: #c5c6c7;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 12px; }
        
        /* ----- اسیلوسکوپ ----- */
        .oscilloscope-wrapper { background: var(--scope-bg); border: 3px solid #232b32; border-radius: 12px; width: 100%; height: 35vh; min-height: 260px; position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.5); display: flex; overflow: hidden; margin-top: 5px; }
        #canvas-div { width: 100%; height: 100%; }
        .scope-hint { 
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%); 
            color: var(--primary); font-size: clamp(0.7rem, 2vw, 0.95rem); pointer-events: none; 
            background: rgba(0, 0, 0, 0.85); padding: 6px 15px; border-radius: 12px; 
            border: 1px solid var(--primary-dark); font-weight: bold; z-index: 5; direction: ltr;
            text-align: center; width: max-content; max-width: 95%; line-height: 1.5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .scope-hint span.up { color: #00ff88; }
        .scope-hint span.down { color: #ff4757; }
        
        .toolbar { display: flex; justify-content: center; background: var(--panel-bg); padding: 8px 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid #2a3540; }
        .controls { display: flex; gap: 8px; direction: ltr; flex-wrap: wrap; justify-content: center;}
        .controls button { background: #2b3744; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: clamp(0.85rem, 2.5vw, 1rem); transition: 0.2s; font-family: 'Vazirmatn'; font-weight: bold; }
        .controls button:hover { background: var(--primary-dark); color: #fff; box-shadow: 0 0 10px var(--primary-dark); }
        
        .network-layout { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 10px; direction: ltr; }
        .computer-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 450px; position: relative; width: 100%; }
        .physical-wire-container { flex: 0.5; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 0; padding-top: 25px; }
        .wire-label { background: #111; color: var(--primary); padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; font-family: monospace; border: 1px solid var(--primary-dark); margin-bottom: -10px; z-index: 2; }
        .wire-line { width: 100%; height: 10px; background: linear-gradient(to bottom, #304a5e, #1a2733); border-top: 1px solid #5a7b96; border-bottom: 1px solid #000; box-shadow: 0 8px 10px rgba(0,0,0,0.5); position: relative; border-radius: 2px; }
        .wire-pulse { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(102, 252, 241, 0.8), transparent); background-size: 200% 100%; animation: pulse-move 2s infinite linear; display: none; }
        @keyframes pulse-move { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .playing .wire-pulse { display: block; }
        
        .monitor-frame { background: #d1d8e0; border-radius: 10px; padding: 10px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.6); border: 2px solid #a5b1c2; position: relative; z-index: 2; }
        .monitor-screen { background: #05080c; border-radius: 6px; min-height: 140px; padding: 12px; box-shadow: inset 0 0 15px rgba(0,0,0,0.9); display: flex; flex-direction: column; border: 3px solid #2d3436; }
        .monitor-stand { background: linear-gradient(to bottom, #a5b1c2, #778ca3); width: 40px; height: 15px; z-index: 1;}
        .monitor-base { background: #778ca3; width: 90px; height: 8px; border-radius: 4px 4px 0 0; z-index: 1; box-shadow: 0 4px 8px rgba(0,0,0,0.5);}
        .comp-label { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); padding: 3px 12px; border-radius: 10px; font-size: clamp(0.7rem, 2vw, 0.8rem); font-weight: bold; direction: rtl; white-space: nowrap; z-index: 15; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .tx-label { border: 2px solid var(--primary); color: var(--primary); }
        .rx-label { border: 2px solid var(--success); color: var(--success); }
        
        .config-row { display: flex; gap: 6px; margin-bottom: 10px; direction: rtl; align-items: center; }
        .config-row input { flex: 1; padding: 5px; border-radius: 4px; border: 1px solid #444; background: #111; color: var(--primary); text-align: center; font-size: clamp(0.8rem, 2.5vw, 0.9rem); font-weight: bold; font-family: 'Vazirmatn'; }
        .btn-send { background: var(--primary-dark); color: white; border: none; padding: 6px 10px; border-radius: 4px; font-family: 'Vazirmatn'; font-size: clamp(0.8rem, 2.5vw, 0.9rem); font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-send:hover { background: var(--primary); color: #000; }
        
        .binary-display { font-family: 'Courier New', monospace; font-size: clamp(0.85rem, 3vw, 1rem); letter-spacing: 1px; direction: ltr; text-align: left; flex: 1; line-height: 1.5; margin-top: 5px; word-break: break-all; }
        .byte-block { display: inline-block; margin-right: 8px; }
        .active-tx-bit { background: var(--primary); color: #000 !important; padding: 0 2px; border-radius: 3px; font-weight: bold; box-shadow: 0 0 8px var(--primary); }
        .new-rx-correct { background: rgba(0, 255, 136, 0.3); font-weight: bold; border-radius: 2px; }
        .final-text { text-align: center; font-size: clamp(1.1rem, 4vw, 1.3rem); color: var(--success); font-weight: bold; margin-top: 5px;}
        
        /* تنظیمات ریسپانسیو اختصاصی موبایل */
        @media (max-width: 768px) {
            body { padding: 5px; } 
            .oscilloscope-wrapper { height: 30vh; min-height: 220px; }
            .scope-hint { white-space: normal; line-height: 1.6; padding: 4px 10px; width: 90%; } /* رفع مشکل خروج متن از صفحه */
            .network-layout { flex-direction: column; gap: 10px; margin-top: 15px;} .computer-wrapper { max-width: 100%; width: 95%; }
            .physical-wire-container { flex: none; width: 100%; height: 50px; padding: 0; flex-direction: row; justify-content: center; align-items: center; }
            .wire-line { width: 10px; height: 100%; background: linear-gradient(to right, #304a5e, #1a2733); border: none; border-left: 1px solid #5a7b96; border-right: 1px solid #000; }
            .wire-label { position: absolute; margin: 0; left: calc(50% + 15px); }
            .wire-pulse { background: linear-gradient(180deg, transparent, rgba(102, 252, 241, 0.8), transparent); background-size: 100% 200%; animation: pulse-move-v 2s infinite linear; }
            @keyframes pulse-move-v { 0% { background-position: 0 200%; } 100% { background-position: 0 -200%; } }
            .monitor-frame { padding: 8px; } .monitor-screen { min-height: 120px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="oscilloscope-wrapper" id="scopeWrapper">
            <div class="scope-hint">
                Manchester Coding: 
                <span class="up">بیت 1 = لبه بالا رونده ⬆</span> &nbsp;|&nbsp; 
                <span class="down">بیت 0 = لبه پایین رونده ⬇</span>
            </div>
            <div id="canvas-div"></div>
        </div>

        <div class="toolbar">
            <div class="controls">
                <button id="btnPrev" title="بازگشت زمان">⏪</button>
                <button id="btnPlayPause" title="توقف/پخش">▶️</button>
                <button id="btnNext" title="جلو بردن زمان">⏩</button>
                <button id="btnReset" title="شروع مجدد">🔄 پاک‌کردن</button>
            </div>
        </div>

        <div class="network-layout" id="networkLayout">
            <div class="computer-wrapper">
                <div class="monitor-frame">
                    <div class="comp-label tx-label">💻 فرستنده (TX)</div>
                    <div class="monitor-screen">
                        <div class="config-row">
                            <input type="text" id="textInput" placeholder="متن (Hi)" value="Hi" maxlength="8">
                            <span style="color:#aaa;">(بدون نیاز به کلاک مجزا)</span>
                        </div>
                        <button class="btn-send" id="btnSend">تایید و ارسال روی سیم</button>
                        <div class="binary-display" id="sentBinary"><span style="color:#555; font-size:0.8rem; direction:rtl; display:block;">منتظر ارسال...</span></div>
                    </div>
                </div>
                <div class="monitor-stand"></div>
                <div class="monitor-base"></div>
            </div>

            <div class="physical-wire-container">
                <div class="wire-label">DATA Cable</div>
                <div class="wire-line"><div class="wire-pulse"></div></div>
            </div>

            <div class="computer-wrapper">
                <div class="monitor-frame" id="rxMonitor">
                    <div class="comp-label rx-label">🖥️ گیرنده (RX)</div>
                    <div class="monitor-screen">
                        <div class="config-row" style="justify-content:center;">
                            <span style="color:var(--success); font-weight:bold; font-size:0.85rem;">همگام‌سازی و استخراج با تشخیص لبه در وسط بیت</span>
                        </div>
                        <hr style="border-color: #222; width: 100%; margin: 3px 0;">
                        <div class="binary-display" id="receivedBinary"></div>
                        <div class="final-text" id="receivedText">-</div>
                    </div>
                </div>
                <div class="monitor-stand"></div>
                <div class="monitor-base"></div>
            </div>
        </div>
    </div>

    <script>
        let binaryData = "";
        let isPlaying = false;
        let hasStarted = false; 
        
        let globalTime = 0; 
        const FPS = 60; 
        
        let isMobile = false;
        let speed = 1.0; 
        const bitDuration = 120; // عرض بیت
        
        let canvasW, canvasH;
        let txX = 50; 
        let defaultRxX = 0; 
        
        const byteColors = ['#00ffcc', '#ff3366', '#ffcc00', '#cc33ff', '#3399ff', '#ff6633', '#00ff44', '#ff33cc'];
        let ripples = []; 
        let rxSampleCount = 0; 
        let rxHtmlMemory = ""; 

        function checkMobile() {
            isMobile = window.innerWidth <= 768;
            speed = isMobile ? 0.6 : 1.2; 
            txX = isMobile ? 30 : 60;
        }

        function stringToBinary(str) {
            let bin = "";
            for (let i = 0; i < str.length; i++) {
                bin += str.charCodeAt(i).toString(2).padStart(8, '0');
            }
            return bin;
        }

        function renderTxBinary(binStr, activeIndex) {
            if (!binStr) return "";
            let html = "";
            let bytes = binStr.match(/.{1,8}/g) || [];
            let globalBitIdx = 0;
            bytes.forEach((byteStr, i) => {
                let color = byteColors[i % byteColors.length];
                html += `<span class="byte-block" style="color:${color}">`;
                for(let b=0; b<8; b++) {
                    if(globalBitIdx === activeIndex) html += `<span class="active-tx-bit">${byteStr[b]}</span>`;
                    else html += byteStr[b];
                    globalBitIdx++;
                }
                html += `</span>`;
            });
            return html;
        }

        function updateRxBinaryUI(newBit) {
            let colorClass = 'new-rx-correct';
            rxHtmlMemory = rxHtmlMemory.replace(/new-rx-correct/g, '');
            
            let byteIndex = Math.floor(rxSampleCount / 8);
            let charColor = byteColors[byteIndex % byteColors.length];
            
            if (rxSampleCount % 8 === 0 && rxSampleCount > 0) rxHtmlMemory += `</span> <span class="byte-block" style="color:${charColor}">`;
            else if (rxSampleCount === 0) rxHtmlMemory += `<span class="byte-block" style="color:${charColor}">`;
            
            rxHtmlMemory += `<span class="${colorClass}">${newBit}</span>`;
            document.getElementById('receivedBinary').innerHTML = rxHtmlMemory + "</span>";
        }

        document.getElementById('textInput').addEventListener('input', function(e) { this.value = this.value.replace(/[^\x00-\x7F]/g, ''); });

        document.getElementById('btnSend').addEventListener('click', startTransmission);
        document.getElementById('btnPlayPause').addEventListener('click', () => {
            if(hasStarted) {
                isPlaying = !isPlaying;
                document.getElementById('btnPlayPause').innerText = isPlaying ? "⏸️" : "▶️";
                if(isPlaying) document.getElementById('networkLayout').classList.add('playing');
                else document.getElementById('networkLayout').classList.remove('playing');
            }
        });
        document.getElementById('btnNext').addEventListener('click', () => {
            if(hasStarted) { isPlaying = false; document.getElementById('btnPlayPause').innerText = "▶️"; document.getElementById('networkLayout').classList.remove('playing'); globalTime += (bitDuration / 4); }
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if(hasStarted) { isPlaying = false; document.getElementById('btnPlayPause').innerText = "▶️"; document.getElementById('networkLayout').classList.remove('playing'); globalTime = Math.max(0, globalTime - (bitDuration / 4)); }
        });
        document.getElementById('btnReset').addEventListener('click', () => {
            isPlaying = false; hasStarted = false; globalTime = 0; ripples = []; rxSampleCount = 0; rxHtmlMemory = "";
            document.getElementById('btnPlayPause').innerText = "▶️";
            document.getElementById('networkLayout').classList.remove('playing');
            document.getElementById('sentBinary').innerHTML = '<span style="color:#555; font-size:0.8rem; direction:rtl; display:block;">منتظر ارسال...</span>';
            document.getElementById('receivedBinary').innerHTML = "";
            document.getElementById('receivedText').innerText = "-";
        });

        function startTransmission() {
            let txt = document.getElementById('textInput').value || "A";
            binaryData = stringToBinary(txt);
            
            globalTime = 0; hasStarted = true; isPlaying = true; ripples = []; rxSampleCount = 0; rxHtmlMemory = "";
            document.getElementById('btnPlayPause').innerText = "⏸️";
            document.getElementById('networkLayout').classList.add('playing');
            document.getElementById('receivedBinary').innerHTML = "";
            document.getElementById('receivedText').innerText = "-";
        }

        // ==========================================
        // P5.js Engine
        // ==========================================
        function setup() {
            checkMobile();
            let container = document.getElementById('canvas-div');
            canvasW = container.offsetWidth; canvasH = container.offsetHeight;
            let cvs = createCanvas(canvasW, canvasH);
            cvs.parent('canvas-div');
            textFont('Vazirmatn');
            
            defaultRxX = canvasW - (isMobile ? 30 : 50);
        }

        function windowResized() {
            checkMobile();
            let container = document.getElementById('canvas-div');
            canvasW = container.offsetWidth; canvasH = container.offsetHeight;
            resizeCanvas(canvasW, canvasH);
            defaultRxX = canvasW - (isMobile ? 30 : 50);
        }

        function draw() {
            background(3, 10, 15); 
            drawScopeGrid();
            drawPorts(); 
            
            if (!hasStarted) {
                fill(100); noStroke(); textAlign(CENTER, CENTER); textSize(isMobile ? 11 : 14); textStyle(BOLD);
                text("تنظیمات را اعمال و پیام را ارسال کنید.", width/2, height/2);
                textStyle(NORMAL);
                return;
            }

            if (isPlaying) globalTime += 1; 

            drawBitGrid(); // کشیدن تایم‌اسلات‌ها و مرزها (بک‌گراند)
            drawSignals(); // کشیدن خط سیگنال
            drawReceiverScanLine(); // کشیدن خط اسکن و نقطه گیرنده (روی سیگنال)
            
            updateTxUI(); 
            processReceiver(); 
            drawRipples(); 
        }

        function drawScopeGrid() {
            stroke(19, 36, 32); strokeWeight(1);
            let gridSize = isMobile ? 25 : 35;
            for(let x=0; x<width; x+=gridSize) line(x, 0, x, height);
            for(let y=0; y<height; y+=gridSize) line(0, y, width, y);
            
            let dataTop = canvasH * 0.3;
            let dataBot = canvasH * 0.7;
            
            stroke(255, 255, 255, 40); drawingContext.setLineDash([2, 4]);
            line(0, dataTop, width, dataTop); line(0, dataBot, width, dataBot);
            drawingContext.setLineDash([]);
            
            let bgW = isMobile ? 45 : 65;
            let bgH = isMobile ? 20 : 30;
            fill(0, 0, 0, 220); noStroke();
            rect(5, dataTop - bgH/2, bgW, bgH, 4);
            rect(5, dataBot - bgH/2, bgW, bgH, 4);
            
            fill('#66fcf1'); textAlign(CENTER, CENTER); textSize(isMobile ? 11 : 14); textStyle(BOLD);
            text("5V", 5 + bgW/2, dataTop);
            text("0V", 5 + bgW/2, dataBot);
            textStyle(NORMAL); 
        }

        function drawPorts() {
            let dataMid = canvasH * 0.5; 
            let portW = isMobile ? 8 : 10;
            let jackH = isMobile ? 18 : 24;

            strokeWeight(isMobile ? 3 : 5); stroke('#4e8cff'); line(0, dataMid, txX, dataMid);
            stroke('#00ff88'); line(defaultRxX, dataMid, canvasW, dataMid);
            
            noStroke(); fill('#2b3744'); rect(txX-portW, 0, portW, height); rect(defaultRxX, 0, portW, height);
            fill('#4e8cff'); rect(txX-portW, dataMid - jackH/2, portW, jackH, 3);
            fill('#00ff88'); rect(defaultRxX, dataMid - jackH/2, portW, jackH, 3);
        }

        // خط اسکن و نقطه متحرک رهگیری سیگنال
        function drawReceiverScanLine() {
            // خط اسکن عمودی
            stroke(0, 255, 136, 120); 
            strokeWeight(isMobile ? 1 : 2); 
            drawingContext.setLineDash([5, 5]);
            line(defaultRxX, canvasH * 0.1, defaultRxX, canvasH * 0.9);
            drawingContext.setLineDash([]);
            
            // ناحیه نیمه شفاف اسکنر
            fill(0, 255, 136, 20); noStroke();
            rect(defaultRxX - 4, canvasH * 0.1, 8, canvasH * 0.8);
            
            // ایده جدید: نمایش یک نقطه درخشان دقیقاً در ولتاژ فعلی روی خط گیرنده (Scan Dot)
            let p = getVoltageAtPixel(defaultRxX);
            if (p.index >= 0) {
                fill('#ffff00');
                noStroke();
                circle(defaultRxX, p.v, isMobile ? 8 : 12);
                
                // یک هاله درخشان دور نقطه
                fill(255, 255, 0, 50);
                circle(defaultRxX, p.v, isMobile ? 16 : 24);
            }
        }

        function getVoltageAtPixel(x) {
            let v0 = canvasH * 0.7; // 0V 
            let v5 = canvasH * 0.3; // 5V 
            
            if (x < txX) return { v: v0, index: -1 }; 
            let dist = x - txX; 
            let timeGenerated = globalTime - (dist / speed);

            if (timeGenerated < 0 || timeGenerated >= binaryData.length * bitDuration) {
                return { v: v0, index: -1 }; 
            }

            let bitIndex = Math.floor(timeGenerated / bitDuration);
            let bitVal = parseInt(binaryData[bitIndex]);
            let bitTime = timeGenerated % bitDuration;
            
            let isFirstHalf = bitTime < (bitDuration / 2);
            let v = (bitVal === 1) ? (isFirstHalf ? v0 : v5) : (isFirstHalf ? v5 : v0);
            
            return { v: v, index: bitIndex, isFirstHalf: isFirstHalf };
        }

        function drawSignals() {
            noFill(); strokeWeight(isMobile ? 3 : 5); 
            let prevIndex = -2;
            let prevV = null;
            let currentPath = [];

            for (let x = txX; x <= defaultRxX; x += 1) {
                let p = getVoltageAtPixel(x);
                if (p.index !== prevIndex || x === defaultRxX) {
                    if (currentPath.length > 0) {
                        let byteIndex = Math.floor(prevIndex / 8);
                        let col = (prevIndex === -1) ? '#555555' : byteColors[byteIndex % byteColors.length];
                        stroke(col);
                        beginShape();
                        for(let pt of currentPath) vertex(pt.x, pt.y);
                        endShape();
                    }
                    currentPath = [];
                    if (prevV !== null && p.v !== prevV && x !== defaultRxX) currentPath.push({x: x, y: prevV});
                }
                currentPath.push({x: x, y: p.v});
                prevIndex = p.index; prevV = p.v;
            }
        }

        function drawBitGrid() {
            for (let i = 0; i <= binaryData.length; i++) {
                let timeGenerated = i * bitDuration;
                let x = txX + ((globalTime - timeGenerated) * speed);
                
                if (x > txX && x <= defaultRxX + (bitDuration * speed)) {
                    
                    // ایده جدید: سایه‌زنی پس زمینه برای تفکیک کامل محدوده‌ی هر بیت
                    if (i < binaryData.length) {
                        let nextX = txX + ((globalTime - (i + 1) * bitDuration) * speed);
                        let drawStartX = constrain(nextX, txX, defaultRxX);
                        let drawEndX = constrain(x, txX, defaultRxX);
                        
                        if (drawStartX < drawEndX && i % 2 === 0) {
                            fill(255, 255, 255, 12); // سایه بسیار ملایم سفید برای بیت‌های زوج
                            noStroke();
                            rect(drawStartX, canvasH * 0.1, drawEndX - drawStartX, canvasH * 0.8);
                        }
                    }

                    if (x < defaultRxX) {
                        // مرز اصلی بیت (واضح‌تر، پررنگ‌تر)
                        stroke(255, 255, 255, 130); // Opacity بیشتر برای وضوح بالاتر
                        strokeWeight(isMobile ? 1 : 2); 
                        drawingContext.setLineDash([8, 6]);
                        line(x, canvasH * 0.12, x, canvasH * 0.88);
                        drawingContext.setLineDash([]);
                        
                        if (i < binaryData.length) {
                            let nextX = txX + ((globalTime - (i + 1) * bitDuration) * speed);
                            let midX = (x + nextX) / 2;
                            
                            if(midX > txX && midX < defaultRxX) {
                                // خط‌چین وسط بیت (محل کلاک / تغییر ولتاژ) - نازک‌تر و کمرنگ‌تر
                                stroke(255, 255, 255, 30); 
                                drawingContext.setLineDash([2, 5]);
                                line(midX, canvasH * 0.2, midX, canvasH * 0.8);
                                drawingContext.setLineDash([]);

                                // نمایش دیتای بیت
                                let byteIndex = Math.floor(i / 8);
                                fill(byteColors[byteIndex % byteColors.length]);
                                noStroke(); textSize(isMobile ? 12 : 16); textAlign(CENTER, BOTTOM); textStyle(BOLD);
                                text(binaryData[i], midX, (canvasH * 0.3) - (isMobile ? 6 : 10));
                                
                                // فلش‌های راهنما
                                textSize(isMobile ? 12 : 16);
                                if (binaryData[i] === '1') {
                                    fill('#00ff88');
                                    text('⬆', midX, (canvasH * 0.7) + (isMobile ? 18 : 25)); 
                                } else {
                                    fill('#ff4757');
                                    text('⬇', midX, (canvasH * 0.7) + (isMobile ? 18 : 25)); 
                                }
                                textStyle(NORMAL);
                            }
                        }
                    }
                }
            }
        }

        function updateTxUI() {
            let p = getVoltageAtPixel(txX + 1);
            document.getElementById('sentBinary').innerHTML = renderTxBinary(binaryData, p.index);
        }

        function processReceiver() {
            let t_arrival = (defaultRxX - txX) / speed;
            let currentRxTime = globalTime - t_arrival;

            if (currentRxTime > 0 && currentRxTime <= binaryData.length * bitDuration) {
                let timeToSampleCurrentBit = (rxSampleCount * bitDuration) + (bitDuration / 2);
                
                if (currentRxTime >= timeToSampleCurrentBit) {
                    let sampled = binaryData[rxSampleCount];
                    updateRxBinaryUI(sampled);

                    let isRisingEdge = (sampled === '1');
                    let sampleY = canvasH * 0.5;
                    
                    ripples.push({
                        x: defaultRxX, 
                        y: sampleY, 
                        radius: isMobile ? 8 : 12, 
                        alpha: 255, 
                        val: sampled,
                        isRising: isRisingEdge
                    });

                    let rxFrame = document.getElementById('rxMonitor');
                    rxFrame.style.boxShadow = isRisingEdge ? "0 0 25px #00ff88" : "0 0 25px #ff4757";
                    setTimeout(() => rxFrame.style.boxShadow = "0 10px 20px rgba(0,0,0,0.6)", 200);

                    rxSampleCount++;
                    
                    let tempDiv = document.createElement('div');
                    tempDiv.innerHTML = rxHtmlMemory;
                    let rawBits = tempDiv.innerText.replace(/\s/g, '');
                    
                    let textOut = "";
                    for (let i = 0; i < rawBits.length; i += 8) {
                        let byte = rawBits.substring(i, i + 8);
                        if (byte.length === 8) textOut += String.fromCharCode(parseInt(byte, 2));
                    }
                    document.getElementById('receivedText').innerText = textOut || "-";
                }
            }
        }

        function drawRipples() {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                let col = r.isRising ? color(0, 255, 136, r.alpha) : color(255, 71, 87, r.alpha);
                
                noFill(); stroke(col); strokeWeight(isMobile ? 2 : 4);
                circle(r.x, r.y, r.radius);
                
                fill(col); noStroke(); textSize(isMobile ? 16 : 22); textAlign(CENTER, CENTER); textStyle(BOLD);
                let icon = r.isRising ? '⬆' : '⬇';
                text(`${r.val} ${icon}`, r.x - (isMobile ? 25 : 35), r.y);
                textStyle(NORMAL);

                r.radius += isMobile ? 1.5 : 2.5;
                r.alpha -= 8; 
                if (r.alpha <= 0) ripples.splice(i, 1);
            }
        }
    </script>
</body>
</html>
